<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Fransiska Farica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navigasi" aria-label="Navigasi utama">
        <a href="profil.html" onclick = "return confirm('Apakah Anda yakin ingin melihat halaman Profil?')">Profil</a>
        <a href="form.html" aria-current="page">Formulir Pendaftaran</a>
        <a href="interaktif.html" onclick = "return confirm('Apakah Anda yakin ingin melihat halaman Interaktif?')">Halaman Interaktif</a>
        
    </nav>
    <main class="page-shell">
        <form class="kartu-form">
            <div class="form-field">
                <label for="name">Nama:</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan Nama" required>
            </div>

            <div class="form-field pilihan-gender">
                <p>Jenis Kelamin:</p>
                <div class="radio-options">
                    <input type="radio" id="laki" name="jenis_kelamin" value="Laki-Laki" required>
                    <label for="laki">Laki-laki</label>

                    <input type="radio" id="perempuan" name="jenis_kelamin" value="Perempuan" required>
                    <label for="perempuan">Perempuan</label>
                </div>
            </div>

            <div class="form-field">
                <label for="prodi">Program Studi:</label>
                <select id="prodi" name="prodi" required>
                    <option value="">Pilih Program Studi</option>
                    <option value="Teknik Industri">Teknik Industri</option>
                    <option value="Informatika">Informatika</option>
                    <option value="Siste Informasi">Sistem Infromasi</option>
                </select>
            </div>

            <div class="form-field">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="email@gmail.com" required>
            </div>

            <div class="form-field">
                <label for ="alasan">Alasan Mendaftar:</label>
                <textarea id="alasan" name="alasan" rows="4" cols="50" placeholder="Masukkan Alasan Mendaftar" ></textarea>
            </div>
            <button type="submit">Submit</button>
        </form>
    </main>
</body>


</html>
