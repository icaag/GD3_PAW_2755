<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InteraktifFransiska Farica</title>
</head>

<body>
    <a href="profil.html" onclick = "return confirm('Apakah Anda yakin ingin melihat halaman Profil?')">Lihat Profil</a>
    <br> 
    <a href="form.html" onclick = "return confirm('Apakah Anda yakin ingin melihat halaman Formulir Pendaftaran?')">Isi Form</a>
    <h1 id= "judulHalaman">Halaman Interaktif</h1>

    <p id="teks">Teks ini bisa berubah!</p>
    <button onclick="ubahBiru()">Ubah ke Biru</button>

    <br> <br>
    <label for="inputNama">Masukkan Nama:</label> 
    <input type="text" id="inputNama" name="nama" placeholder="Masukkan Nama" required>
    <button onclick="tampilkanNama()">Tampilkan</button>

    <br> <br>
    <p>Perkalian</p>
    <label for="angka1">Masukkan Angka Pertama:</label>
    <input type="number" id="angka1" name ="angka1">
    <br> <br>
    <label for="angka2">Masukkan Angka Kedua:</label>
    <input type="number" id="angka2" name ="angka2">
    <br>
    <button onclick="hitungPerkalian()">Hitung</button>
    
</body>

<script>
    const judulHalaman = document.getElementById("judulHalaman");
    
    judulHalaman.style.color = "red";
    console.log(judulHalaman.innerHTML);

    //Function
   function sapa(nama) {
        return "Halo, " + nama + "!";
    }
    console.log(sapa("Farica"));

    //Manipulasi Teks dengan Event
    const teks = document.getElementById("teks");
    function ubahBiru() {
        teks.style.color = "blue";
    }

    //Dialog Box
    function tampilkanNama(){
        const inputNama = document.getElementById("inputNama").value;
        if(inputNama === ""){
            alert("Silakan isi nama dulu.");
            return;
        }else{
            alert("Halo, " + inputNama + "!");
            return;
        }
        
    }

    //UGD- fungsi hitung sederhana
    function hitungPerkalian(){
        const angka1 = document.getElementById("angka1").value;    
        const angka2 = document.getElementById("angka2").value; 
        alert("Hasil " + angka1 + " dikalikan dengan " + angka2 + " adalah " + (angka1 * angka2)+ ".");
        return;
    }
</script>
